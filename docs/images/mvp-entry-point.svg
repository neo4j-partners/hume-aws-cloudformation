<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 18 908 516" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Public Entry Point</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <!-- White card -->
  <rect x="40" y="32" width="880" height="488" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#sh)"/>

  <!-- ============ SECTION 1: ONE PUBLIC DEPLOYMENT ============ -->
  <text x="64" y="63" fill="#5C6470" font-size="8.5" font-weight="700" letter-spacing="0.4">1. ONE PUBLIC DEPLOYMENT: ALLOWLISTED USERS REACH HUME OVER THE INTERNET THROUGH WAF AND AN INTERNET-FACING ALB</text>
  <line x1="64" y1="68" x2="894" y2="68" stroke="#E7E4DB" stroke-width="1"/>

  <rect x="64" y="80" width="832" height="304" rx="12" fill="#FAFAF8" stroke="#DAD7CE"/>
  <text x="76" y="100" fill="#16233A" font-size="11" font-weight="700" letter-spacing="0.3">PUBLIC DEPLOYMENT</text>
  <text x="884" y="100" fill="#5C6470" font-size="8.5" text-anchor="end">internet-facing ALB in the public subnets of the Neo4j EE VPC</text>

  <!-- Users (external) -->
  <rect x="350" y="114" width="260" height="34" rx="8" fill="#F6E3B4" stroke="#B7791F"/>
  <text x="480" y="129" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">Users</text>
  <text x="480" y="141" fill="#6B4E12" font-size="8" text-anchor="middle">public internet, from up to five allowlisted addresses</text>

  <line x1="480" y1="148" x2="480" y2="160" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <text x="488" y="157" fill="#5C6470" font-size="8">HTTPS on 443, host rules for web, api and media; 80 redirects</text>

  <!-- WAF (AWS) -->
  <rect x="350" y="164" width="260" height="34" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="480" y="179" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">AWS WAF</text>
  <text x="480" y="191" fill="#5C6470" font-size="8" text-anchor="middle">AWS managed rule groups and a rate limit per address</text>

  <line x1="480" y1="198" x2="480" y2="210" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <!-- Internet-facing ALB (AWS) -->
  <rect x="350" y="214" width="260" height="34" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="480" y="229" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">Internet-facing ALB</text>
  <text x="480" y="241" fill="#5C6470" font-size="8" text-anchor="middle">one HTTPS listener on 443 with host rules, port 80 redirects</text>

  <!-- Route 53 (AWS), left of the ALB -->
  <rect x="80" y="206" width="236" height="50" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="198" y="223" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">Route 53 hosted zone</text>
  <text x="198" y="237" fill="#5C6470" font-size="8" text-anchor="middle">same account; the template writes the alias record</text>
  <text x="198" y="249" fill="#5C6470" font-size="8" text-anchor="middle">for each of the three names and the ACM validation records</text>
  <line x1="320" y1="231" x2="346" y2="231" stroke="#8A8A8A" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <!-- ALB security group (AWS), right of the ALB -->
  <rect x="644" y="206" width="236" height="50" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="762" y="223" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">ALB security group</text>
  <text x="762" y="237" fill="#5C6470" font-size="8" text-anchor="middle">inbound 443 and 80 only from the</text>
  <text x="762" y="249" fill="#5C6470" font-size="8" text-anchor="middle">single addresses in AllowedCidr1 to AllowedCidr5</text>
  <line x1="640" y1="231" x2="614" y2="231" stroke="#8A8A8A" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowGray)"/>

  <line x1="480" y1="248" x2="480" y2="260" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <!-- Hume services (Hume) -->
  <rect x="350" y="264" width="260" height="40" rx="8" fill="#1E8C7E" stroke="#156459"/>
  <text x="480" y="281" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Hume services</text>
  <text x="480" y="295" fill="#CFEDE8" font-size="8" text-anchor="middle">five services on ECS, one EC2 instance, private subnet</text>

  <!-- fork to RDS and Neo4j -->
  <line x1="380" y1="304" x2="380" y2="326" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <text x="372" y="319" fill="#5C6470" font-size="8" text-anchor="end">Postgres 5432</text>
  <line x1="580" y1="304" x2="580" y2="326" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <text x="588" y="319" fill="#2E6DB4" font-size="8" font-weight="700">neo4j+s, Bolt 7687, TLS</text>

  <!-- RDS (AWS) -->
  <rect x="262" y="330" width="206" height="40" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="365" y="347" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">RDS for Postgres</text>
  <text x="365" y="361" fill="#5C6470" font-size="8" text-anchor="middle">single-AZ, encrypted with the stack's KMS key</text>

  <!-- Neo4j EE (Neo4j) -->
  <rect x="492" y="330" width="206" height="40" rx="8" fill="#2E6DB4" stroke="#1F4E86"/>
  <text x="595" y="347" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Neo4j EE</text>
  <text x="595" y="361" fill="#DEEAF6" font-size="8" text-anchor="middle">deployed first, 3 nodes behind an internal NLB</text>

  <!-- ============ SECTION 2: DOMAIN NAME AND CERTIFICATE ============ -->
  <text x="64" y="413" fill="#5C6470" font-size="8.5" font-weight="700" letter-spacing="0.4">2. DOMAIN NAME AND CERTIFICATE: THE CUSTOMER SUPPLIES ONE BASE DOMAIN NAME AND A HOSTED ZONE ID, AND THE TEMPLATE DOES THE REST</text>
  <line x1="64" y1="418" x2="894" y2="418" stroke="#E7E4DB" stroke-width="1"/>

  <rect x="64" y="428" width="266" height="44" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="197" y="446" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">One base domain name</text>
  <text x="197" y="461" fill="#5C6470" font-size="8" text-anchor="middle">BaseDomainName; hume, hume-api and hume-media are derived</text>

  <rect x="347" y="428" width="266" height="44" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="480" y="446" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">One ACM certificate</text>
  <text x="480" y="461" fill="#5C6470" font-size="8" text-anchor="middle">covers the three names, validated by DNS in the hosted zone</text>

  <rect x="630" y="428" width="266" height="44" rx="8" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="763" y="446" fill="#16233A" font-size="11" font-weight="700" text-anchor="middle">DNS records written by the template</text>
  <text x="763" y="461" fill="#5C6470" font-size="8" text-anchor="middle">three alias A records to the ALB in the zone named by HostedZoneId</text>

  <text x="64" y="490" fill="#5C6470" font-size="8.5">No CloudFront and no internal ALB: a private entry point is a roadmap item. Sign-in goes to the customer's OIDC provider (AuthProvider defaults to Oidc).</text>

  <!-- ============ LEGEND ============ -->
  <rect x="64" y="500" width="9" height="9" rx="2" fill="#1E8C7E"/>
  <text x="78" y="508" fill="#16233A" font-size="9">Hume</text>
  <rect x="120" y="500" width="9" height="9" rx="2" fill="#2E6DB4"/>
  <text x="134" y="508" fill="#16233A" font-size="9">Neo4j</text>
  <rect x="176" y="500" width="9" height="9" rx="2" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="190" y="508" fill="#16233A" font-size="9">AWS service or network</text>
  <rect x="306" y="500" width="9" height="9" rx="2" fill="#F6E3B4" stroke="#B7791F"/>
  <text x="320" y="508" fill="#16233A" font-size="9">Users</text>
</svg>
