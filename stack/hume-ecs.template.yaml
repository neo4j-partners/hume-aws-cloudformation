AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Hume on ECS with EC2 capacity, in the VPC of a Neo4j Enterprise Edition
  stack. Creates the ECS cluster, one container instance, generated secrets,
  an RDS PostgreSQL instance, the Hume services, an HTTPS load balancer with a
  WAF, and log groups. Nothing is downloaded on deployment. The AMI carries
  every Hume container image, so no registry or package repository is
  contacted. The boot script in the launch template calls only the EC2
  instance metadata service at the link-local address 169.254.169.254 and AWS
  APIs in the stack's own Region: AWS CloudFormation (DescribeStackResource,
  SignalResource), Amazon ECS (PutAccountSetting) and AWS Secrets Manager
  (GetSecretValue). The stack's own calls send no customer data outside the
  buyer's account. The ExternalConnectivityDisclosure metadata lists every
  connection.

Metadata:
  ExternalConnectivityDisclosure:
    Description: >-
      Every connection this product makes. The product downloads nothing on
      deployment. All AWS API calls use the stack's own IAM roles and stay in
      the buyer's account and Region. The stack's own calls send no customer
      data outside the buyer's account.
    DeployTimeExternalDependencies: []
    AWSServiceEndpoints:
      - Endpoint: http://169.254.169.254
        Note: Link-local address on the instance. It is not an external endpoint.
        Caller: Boot script in InstanceLaunchTemplate UserData, through curl
        Purpose: >-
          Reads an IMDSv2 session token and the instance id. The instance id
          is the unique id of the boot signal.
        DataSent: None
      - Endpoint: Regional AWS CloudFormation API
        Caller: Boot script in InstanceLaunchTemplate UserData, through the AWS CLI
        Actions:
          - cloudformation:DescribeStackResource
          - cloudformation:SignalResource
        Purpose: Reads the InstanceBootComplete resource and signals it.
        Route: The VPC's interface endpoint, created or reused by the Neo4j EE stack
        DataSent: The boot status and the instance id
      - Endpoint: Regional Amazon ECS API
        Caller: Boot script in InstanceLaunchTemplate UserData, through the AWS CLI
        Actions:
          - ecs:PutAccountSetting
        Purpose: Turns on ENI trunking for the instance role only.
        Route: The VPC's NAT gateways
        DataSent: The setting name and value
      - Endpoint: Regional AWS Secrets Manager API
        Caller: Boot script in InstanceLaunchTemplate UserData, through the AWS CLI
        Actions:
          - secretsmanager:GetSecretValue
        Purpose: Reads the truststore secret in Neo4jTruststoreSecretArn.
        Route: The VPC's interface endpoint, created or reused by the Neo4j EE stack
        DataSent: None
      - Endpoint: Regional AWS Systems Manager API
        Caller: Neo4jEeLookupFunction, during create and update
        Actions:
          - ssm:GetParameters
        Purpose: Reads the Neo4j EE stack's values under /neo4j-ee/<EeStackName>/.
        DataSent: None
      - Endpoint: Regional Amazon ECS API
        Caller: RunTaskFunction, during create and update
        Actions:
          - ecs:RunTask
          - ecs:DescribeTasks
          - ecs:StopTask
        Purpose: Runs the one-time database setup task.
        DataSent: None
      - Endpoint: Regional Amazon RDS and AWS Secrets Manager APIs
        Caller: DbMasterResetFunction, only on a restore from a snapshot
        Actions:
          - rds:DescribeDBInstances
          - rds:ModifyDBInstance
          - secretsmanager:GetSecretValue
        Purpose: Sets the database master password from the stack's secret.
        DataSent: The new master password, to Amazon RDS only
      - Endpoint: Pre-signed Amazon S3 address from AWS CloudFormation
        Caller: Each of the three Lambda functions
        Purpose: Returns the custom resource result to CloudFormation.
        DataSent: The custom resource status and its output values
      - Endpoint: >-
          Regional Amazon ECS, Amazon EC2, AWS Secrets Manager, AWS KMS, Amazon
          CloudWatch Logs and AWS Systems Manager APIs
        Caller: The Amazon ECS agent and the AWS Systems Manager agent on the instance
        Purpose: >-
          Register the instance, run the tasks, read the task secrets, send
          the container logs and provide Session Manager.
        Route: >-
          Amazon ECS through the VPC's NAT gateways. The other services through
          the VPC's interface endpoints, created or reused by the Neo4j EE
          stack. Secrets Manager calls AWS KMS itself, so the instance makes no
          KMS call.
        DataSent: Container logs, to CloudWatch Logs in the buyer's account
    RuntimeConnections:
      - Endpoint: Neo4j EE cluster in the same VPC, neo4j+s on port 7687
        Caller: Hume services
        Purpose: Reads and writes the knowledge graph.
      - Endpoint: Amazon RDS database and Amazon EFS file system in the same VPC
        Caller: Hume services
        Purpose: Stores Hume settings and files.
      - Endpoint: The OpenID Connect provider set in OidcIssuerUri, over HTTPS
        Caller: Hume API and media services
        Purpose: Fetches the provider's signing keys.
      - Endpoint: tile.openstreetmap.org
        Caller: The user's browser, not the stack
        Purpose: Loads map tiles for map widgets. An administrator can set a different tile server.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Image and capacity
        Parameters:
          - HumeAmiId
          - InstanceType
          - RootVolumeSize
      - Label:
          default: Access
        Parameters:
          - AllowedCidr1
          - AllowedCidr2
          - AllowedCidr3
          - AllowedCidr4
          - AllowedCidr5
      - Label:
          default: Licence
        Parameters:
          - HumeLicenceSecretArn
      - Label:
          default: Database and logs
        Parameters:
          - DbInstanceClass
          - DbEngineVersion
          - DbBackupRetentionDays
          - LogRetentionDays
          - AccessLogExpirationDays
      - Label:
          default: Restore from an earlier stack
        Parameters:
          - DbSnapshotIdentifier
          - ExistingFileSystemId
          - ExistingDataKeyArn
      - Label:
          default: Alarms
        Parameters:
          - AlarmEmail
      - Label:
          default: Copies of each service
        Parameters:
          - EventstoreCopies
          - ApiCopies
          - MediaCopies
          - WebCopies
      - Label:
          default: Hume version and domain
        Parameters:
          - HumeVersion
          - BaseDomainName
          - HostedZoneId
      - Label:
          default: Sign-in
        Parameters:
          - AuthProvider
          - OidcIssuerUri
          - OidcClientId
          - OidcRolesMappings
          - OidcRolesClaimPath
          - OidcPrincipalClaim
          - OidcJwkSetUri
          - OidcScope
      - Label:
          default: Neo4j connection
        Parameters:
          - EeStackName
          - Neo4jTruststoreSecretArn
      - Label:
          default: Demo
        Parameters:
          - SpineConfigSecretArn

Parameters:
  HumeAmiId:
    Type: AWS::EC2::Image::Id
    Description: Private Hume AMI for this release. It holds the container images, so no registry is contacted at runtime.

  InstanceType:
    Type: String
    Default: m6i.xlarge
    AllowedValues:
      - m6i.large
      - m6i.xlarge
    Description: Must support ENI trunking. m6i.xlarge runs 20 awsvpc tasks, m6i.large runs 10.

  RootVolumeSize:
    Type: Number
    Default: 40
    MinValue: 40
    MaxValue: 200
    Description: Root volume size in GiB. It must hold the images baked into the AMI, with headroom.

  AllowedCidr1:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'
    ConstraintDescription: Must be an IPv4 range in CIDR form, such as 203.0.113.10/32 or 198.51.100.0/24.
    Description: First range allowed to reach the load balancer. It is required, so the UI is never open to the internet by accident. Use 0.0.0.0/0 to open it to the internet, which needs AuthProvider Oidc. Find your address at https://checkip.amazonaws.com.

  AllowedCidr2:
    Type: String
    Default: ''
    AllowedPattern: '^((\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2]))?$'
    ConstraintDescription: Must be empty or an IPv4 range in CIDR form, such as 203.0.113.10/32 or 198.51.100.0/24.
    Description: Optional extra range, slot 2 of 5. Leave it empty to use no slot. stack/allowlist.py fills and clears the slots.

  AllowedCidr3:
    Type: String
    Default: ''
    AllowedPattern: '^((\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2]))?$'
    ConstraintDescription: Must be empty or an IPv4 range in CIDR form, such as 203.0.113.10/32 or 198.51.100.0/24.
    Description: Optional extra range, slot 3 of 5. Leave it empty to use no slot. stack/allowlist.py fills and clears the slots.

  AllowedCidr4:
    Type: String
    Default: ''
    AllowedPattern: '^((\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2]))?$'
    ConstraintDescription: Must be empty or an IPv4 range in CIDR form, such as 203.0.113.10/32 or 198.51.100.0/24.
    Description: Optional extra range, slot 4 of 5. Leave it empty to use no slot. stack/allowlist.py fills and clears the slots.

  AllowedCidr5:
    Type: String
    Default: ''
    AllowedPattern: '^((\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2]))?$'
    ConstraintDescription: Must be empty or an IPv4 range in CIDR form, such as 203.0.113.10/32 or 198.51.100.0/24.
    Description: Optional extra range, slot 5 of 5. Leave it empty to use no slot. stack/allowlist.py fills and clears the slots.

  HumeLicenceSecretArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:\d{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}$'
    ConstraintDescription: >-
      Must be a full Secrets Manager secret ARN, including the six-character
      suffix.
    Description: ARN of the secret that holds the Hume licence key. The user creates it once outside the stack, so the key never passes through CloudFormation. The Hume service tasks read it.

  DbInstanceClass:
    Type: String
    Default: db.t4g.medium
    Description: RDS instance class for the four Hume databases.

  DbEngineVersion:
    Type: String
    Default: '17'
    Description: RDS PostgreSQL engine version. The parameter group family is postgres17, so keep this on major version 17.

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: Retention for every log group in the stack.

  DbBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Days that RDS keeps automated backups. The database also keeps a final snapshot when the stack deletes it.

  DbSnapshotIdentifier:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9:-]*$'
    ConstraintDescription: Must be empty, a snapshot name, or a snapshot ARN.
    Description: >-
      Optional. Name or ARN of a database snapshot from an earlier Hume stack.
      When it is set, the stack restores the database from the snapshot
      instead of creating an empty one. Set it on create only, then pass the
      same value on every update. A changed or cleared value replaces the
      database. Keep the snapshot until the restored stack is proven.

  ExistingFileSystemId:
    Type: String
    Default: ''
    AllowedPattern: '^(fs-[0-9a-f]{8,40})?$'
    ConstraintDescription: Must be empty or an EFS file system ID, such as fs-0123456789abcdef0.
    Description: >-
      Optional. EFS file system kept from an earlier Hume stack. When it is
      set, the stack uses it for the Hume data instead of creating a new one.
      Delete the earlier stack first, because the file system must have no
      mount targets left. Set it on create only, then pass the same value on
      every update.

  ExistingDataKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:kms:[a-z0-9-]+:\d{12}:key/[A-Za-z0-9-]+)?$'
    ConstraintDescription: Must be empty or a full KMS key ARN.
    Description: >-
      Optional. ARN of the KMS key kept from an earlier Hume stack. The
      stack uses it instead of creating a new key. It is required when
      DbSnapshotIdentifier or ExistingFileSystemId is set, because a restored
      database and a kept file system stay encrypted with their original key.
      Set it on create only, then pass the same value on every update.

  AccessLogExpirationDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: Days after which the S3 lifecycle rule deletes load balancer access logs.

  AlarmEmail:
    Type: String
    Default: ''
    AllowedPattern: '^([^@\s]+@[^@\s]+\.[^@\s]+)?$'
    ConstraintDescription: Must be empty or an email address.
    Description: >-
      Optional address for alarm notifications. The topic is created either
      way. When this is set, SNS sends a confirmation mail, and the address
      receives alarms only after its owner confirms.

  EventstoreCopies:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Number of eventstore tasks. The one container instance must have room for every copy.

  ApiCopies:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Number of api tasks. The one container instance must have room for every copy.

  MediaCopies:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Number of media tasks. The one container instance must have room for every copy.

  WebCopies:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Number of web tasks. The one container instance must have room for every copy.

  HumeVersion:
    Type: String
    Default: 3.2.1
    AllowedValues:
      - 3.2.1
    Description: Tag of the Hume images baked into the AMI. It must match the AMI exactly, because prefer-cached pulls remotely on any mismatch. It is also the value of the hume.version instance attribute that services are placed on.

  BaseDomainName:
    Type: String
    MaxLength: 59
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Use a lower case name with at least two labels and at most 59 characters, such as example.com.
    Description: Base name of the Hume hosts. The stack serves hume.<base>, hume-api.<base> and hume-media.<base>, and it creates one certificate for the three names and one alias record for each. The base may equal the hosted zone name or sit below it, and the stack never writes a record at the base itself. Route 53 rejects any record outside the zone. ACM limits the first certificate name to 64 characters, so the base is at most 59.

  HostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]{8,31}$'
    ConstraintDescription: Use the bare zone ID, such as Z0123456789ABC. Do not include the /hostedzone/ prefix.
    Description: ID of the existing public Route 53 hosted zone that contains the three Hume hosts. The zone is shared with other sites. The stack creates and deletes only the three host records and their certificate validation records.

  EeStackName:
    Type: String
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]{0,127}$'
    ConstraintDescription: Must be a CloudFormation stack name of letters, digits and hyphens.
    Description: >-
      Name of the Neo4j EE stack that Hume joins. Hume needs a three-server
      Neo4j EE stack in this account and Region. Hume runs in its VPC and
      subnets, and it reads the Neo4j host, the app user, the password secret
      and the network values that the Neo4j EE stack publishes in Parameter
      Store under /neo4j-ee/<name>/. A wrong name or a one-server stack fails
      the create within a minute. Nothing that the stack keeps on delete is
      created before that check.

  Neo4jTruststoreSecretArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:\d{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}$'
    ConstraintDescription: Must be a full Secrets Manager secret ARN, including the six-character suffix.
    Description: >-
      ARN of the secret that holds a truststore for the
      certificate authority of the Neo4j load balancer. Its SecretString is
      JSON with two keys. truststore is the truststore file, base64.
      java_tool_options is the full JAVA_TOOL_OPTIONS value for Orchestra and
      the API, so the truststore type and password travel with the file. The
      value must point at /opt/hume-truststore, the path where both tasks see
      the file. The instance writes the file to the host at boot and checks
      that both keys are set. The JVM may print the option string in the
      Orchestra and API logs, so the truststore must hold only certificates
      and a password that protects nothing else. The truststore replaces the
      default roots of both JVMs, so it must also hold the roots of the
      identity provider, which the API calls for its signing keys.

  AuthProvider:
    Type: String
    Default: Oidc
    AllowedValues:
      - Oidc
      - Native
    Description: >-
      Oidc signs users in through the customer's OpenID Connect provider, and a
      provider group grants the Hume administrator role. Native uses Hume's own
      user store with a generated administrator password. Native is a fallback
      for troubleshooting.

  OidcIssuerUri:
    Type: String
    Default: ''
    AllowedPattern: '^(https://\S+[^/\s])?$'
    ConstraintDescription: Must be empty or an https URL without a trailing slash.
    Description: >-
      Oidc only. The issuer URL of the OpenID Connect provider, exactly as its
      discovery document gives it.

  OidcClientId:
    Type: String
    Default: ''
    AllowedPattern: '^\S*$'
    ConstraintDescription: Must be empty or a client id without spaces.
    Description: >-
      Oidc only. The id of the public client that hume-web signs in with. The
      client must allow the authorization code flow and the Hume web address
      as a callback.

  OidcRolesMappings:
    Type: String
    Default: hume-admins=ADMINISTRATOR,hume-users=USER
    AllowedPattern: '^[^=,\s]+=[^=,\s]+(,[^=,\s]+=[^=,\s]+)*$'
    ConstraintDescription: >-
      Must be one or more group=ROLE pairs separated by commas, without spaces.
    Description: >-
      Oidc only. The provider groups and the Hume role each one grants, as
      group=ROLE pairs separated by commas. A user whose groups map to no role
      cannot sign in.

  OidcRolesClaimPath:
    Type: String
    Default: "$['cognito:groups']"
    AllowedPattern: '^\$\S+$'
    ConstraintDescription: Must be a JsonPath that starts with $.
    Description: >-
      Oidc only. The JsonPath of the groups claim in the token. The default is
      the Amazon Cognito claim. A claim name with a colon needs the bracket
      form.

  OidcPrincipalClaim:
    Type: String
    Default: username
    AllowedPattern: '^\S+$'
    ConstraintDescription: Must be one claim name without spaces.
    Description: >-
      Oidc only. The claim that holds the user name. The default is the claim
      in an Amazon Cognito access token.

  OidcJwkSetUri:
    Type: String
    Default: ''
    AllowedPattern: '^(https://\S+)?$'
    ConstraintDescription: Must be empty or an https URL.
    Description: >-
      Oidc only. The address of the provider's signing keys, the jwks_uri value
      in its discovery document. Leave it empty for Amazon Cognito. An empty
      value uses the issuer URL with /.well-known/jwks.json added.

  OidcScope:
    Type: String
    Default: openid profile email
    AllowedPattern: '^(\S+ )*openid( \S+)*$'
    ConstraintDescription: Must be scopes separated by single spaces, including openid.
    Description: >-
      Oidc only. The scopes that hume-web requests at sign-in, separated by
      spaces. Microsoft Entra ID needs the scope of the exposed API here, so
      that the access token is issued for that API.

  SpineConfigSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^(arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:\d{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6})?$'
    ConstraintDescription: Must be empty or a full Secrets Manager secret ARN, including the six-character suffix.
    Description: >-
      Spine demo only. Full ARN of the secret hume/<stack name>/spine-config,
      including its six-character suffix. ECS reads a Secrets Manager secret
      only by its full ARN. Leave it empty on create. Set it by an update
      after the spine database is loaded on the Neo4j cluster. The update then
      runs the hume-config-cli configuration import that creates the SPINE
      knowledge graph. While it is empty, the stack runs no configuration
      import.

Rules:
  OidcNeedsIssuerAndClient:
    RuleCondition: !Equals [!Ref AuthProvider, Oidc]
    Assertions:
      - Assert: !Not [!Equals [!Ref OidcIssuerUri, '']]
        AssertDescription: OidcIssuerUri is required when AuthProvider is Oidc.
      - Assert: !Not [!Equals [!Ref OidcClientId, '']]
        AssertDescription: OidcClientId is required when AuthProvider is Oidc.

  # Native sign-in has one shared administrator password, so the UI must not be
  # open to the internet with it.
  NativeIsNotPublic:
    RuleCondition: !Equals [!Ref AuthProvider, Native]
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedCidr1, 0.0.0.0/0]]
        AssertDescription: >-
          AuthProvider must be Oidc when AllowedCidr1 is 0.0.0.0/0. Native
          sign-in is not allowed on a load balancer open to the internet.
      - Assert: !Not [!Equals [!Ref AllowedCidr2, 0.0.0.0/0]]
        AssertDescription: >-
          AuthProvider must be Oidc when AllowedCidr2 is 0.0.0.0/0. Native
          sign-in is not allowed on a load balancer open to the internet.
      - Assert: !Not [!Equals [!Ref AllowedCidr3, 0.0.0.0/0]]
        AssertDescription: >-
          AuthProvider must be Oidc when AllowedCidr3 is 0.0.0.0/0. Native
          sign-in is not allowed on a load balancer open to the internet.
      - Assert: !Not [!Equals [!Ref AllowedCidr4, 0.0.0.0/0]]
        AssertDescription: >-
          AuthProvider must be Oidc when AllowedCidr4 is 0.0.0.0/0. Native
          sign-in is not allowed on a load balancer open to the internet.
      - Assert: !Not [!Equals [!Ref AllowedCidr5, 0.0.0.0/0]]
        AssertDescription: >-
          AuthProvider must be Oidc when AllowedCidr5 is 0.0.0.0/0. Native
          sign-in is not allowed on a load balancer open to the internet.

  # A restored database and a kept file system stay encrypted with the key of
  # the earlier stack, so the stack must adopt that key.
  SnapshotNeedsExistingKey:
    RuleCondition: !Not [!Equals [!Ref DbSnapshotIdentifier, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingDataKeyArn, '']]
        AssertDescription: >-
          ExistingDataKeyArn is required when DbSnapshotIdentifier is set. Use
          the DataKeyArn output of the earlier stack.

  FileSystemNeedsExistingKey:
    RuleCondition: !Not [!Equals [!Ref ExistingFileSystemId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingDataKeyArn, '']]
        AssertDescription: >-
          ExistingDataKeyArn is required when ExistingFileSystemId is set. Use
          the DataKeyArn output of the earlier stack.

Mappings:
  # AWS Partner Revenue Measurement. Every taggable resource carries this tag,
  # so AWS can attribute the stack's usage to the Hume Marketplace listing. The
  # key names the Neo4j partner account and the value is the Hume product code.
  Prm:
    Tag:
      Key: aws-apn-id-385155106615
      Value: pc:7zd8meh8xo9g62zqwwvprdw7m

Conditions:
  UseOidc: !Equals [!Ref AuthProvider, Oidc]
  UseOidcJwkSetUri: !Not [!Equals [!Ref OidcJwkSetUri, '']]
  UseNativeAuth: !Equals [!Ref AuthProvider, Native]
  UseSpineImport: !Not [!Equals [!Ref SpineConfigSecretArn, '']]
  UseAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  UseCidr2: !Not [!Equals [!Ref AllowedCidr2, '']]
  UseCidr3: !Not [!Equals [!Ref AllowedCidr3, '']]
  UseCidr4: !Not [!Equals [!Ref AllowedCidr4, '']]
  UseCidr5: !Not [!Equals [!Ref AllowedCidr5, '']]
  CreateDataKey: !Equals [!Ref ExistingDataKeyArn, '']
  CreateFileSystem: !Equals [!Ref ExistingFileSystemId, '']
  RestoreDatabase: !Not [!Equals [!Ref DbSnapshotIdentifier, '']]

Resources:
  # ---------------------------------------------------------------------------
  # Network. The stack creates no VPC or subnets. It runs in the VPC of the
  # Neo4j EE stack and uses the subnets that the Neo4jEeLookup resource reads.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Neo4j EE lookup (Custom::Neo4jEeLookup). On Create and Update the function
  # reads the values that the Neo4j EE stack publishes under
  # /neo4j-ee/<EeStackName>/ and returns them as attributes. Every resource that
  # uses one waits for it, so a missing or one-server Neo4j EE stack fails the
  # create before anything else exists. Update also runs the lookup, because a
  # rollback sends Update with the old properties and needs the attributes back.
  # Delete does nothing and keeps the physical id.
  # ---------------------------------------------------------------------------
  Neo4jEeLookupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-neo4j-ee-lookup'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  Neo4jEeLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadNeo4jEeParameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neo4j-ee/${EeStackName}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt Neo4jEeLookupLogGroup.Arn
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  Neo4jEeLookupFunction:
    Type: AWS::Lambda::Function
    DependsOn: Neo4jEeLookupLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-neo4j-ee-lookup'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt Neo4jEeLookupRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          ssm = boto3.client("ssm")
          # Each attribute and the name under /neo4j-ee/<stack>/ that holds it.
          ATTRIBUTES = {
              "Neo4jHost": "advertised-dns",
              "VpcId": "vpc-id",
              "PublicSubnet1Id": "public-subnet-1-id",
              "PublicSubnet2Id": "public-subnet-2-id",
              "PublicSubnet3Id": "public-subnet-3-id",
              "PrivateSubnet1Id": "private-subnet-1-id",
              "PrivateSubnet2Id": "private-subnet-2-id",
              "Neo4jNlbSecurityGroupId": "external-sg-id",
              "VpcEndpointSecurityGroupId": "vpc-endpoint-sg-id",
              "Neo4jUsername": "app-username",
              "Neo4jAppPasswordSecretArn": "app-password-secret-arn",
              "Neo4jSecretsKmsKeyArn": "kms-key-arn",
          }
          # A one-server Neo4j EE stack publishes only the first public subnet.
          ONE_SERVER_MISSING = {"public-subnet-2-id", "public-subnet-3-id"}
          # GetParameters takes at most 10 names in one call.
          BATCH_SIZE = 10


          def read_values(stack):
              prefix = f"/neo4j-ee/{stack}/"
              names = [prefix + name for name in ATTRIBUTES.values()]
              found = {}
              for start in range(0, len(names), BATCH_SIZE):
                  response = ssm.get_parameters(Names=names[start : start + BATCH_SIZE])
                  for parameter in response["Parameters"]:
                      found[parameter["Name"].removeprefix(prefix)] = parameter["Value"]
              return found


          def lookup(stack):
              found = read_values(stack)
              missing = [name for name in ATTRIBUTES.values() if name not in found]
              if len(missing) == len(ATTRIBUTES):
                  raise ValueError(
                      f"No Neo4j EE stack named {stack} in this account and Region. "
                      "Deploy Neo4j EE from AWS Marketplace first."
                  )
              if set(missing) == ONE_SERVER_MISSING:
                  raise ValueError(
                      f"Neo4j EE stack {stack} has one server. Hume needs a "
                      "three-server Neo4j EE stack. Deploy Neo4j EE with "
                      "NumberOfServers 3."
                  )
              if missing:
                  raise ValueError(
                      f"Neo4j EE stack {stack} does not publish "
                      f"{', '.join(missing)} under /neo4j-ee/{stack}/."
                  )
              return {attribute: found[name] for attribute, name in ATTRIBUTES.items()}


          def handler(event, context):
              physical_id = event.get("PhysicalResourceId", event["LogicalResourceId"])
              if event["RequestType"] == "Delete":
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, physical_id)
                  return
              stack = event["ResourceProperties"]["EeStackName"]
              # Every error must reach CloudFormation, or the stack waits for the
              # service timeout.
              try:
                  data = lookup(stack)
              except Exception as exc:
                  print(f"{event['RequestType']} failed: {exc}")
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {}, physical_id,
                      reason=str(exc)[:1000],
                  )
                  return
              print(f"Read {len(data)} values of Neo4j EE stack {stack}")
              cfnresponse.send(event, context, cfnresponse.SUCCESS, data, physical_id)
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  Neo4jEeLookup:
    Type: Custom::Neo4jEeLookup
    Properties:
      ServiceToken: !GetAtt Neo4jEeLookupFunction.Arn
      ServiceTimeout: 120
      EeStackName: !Ref EeStackName

  # ---------------------------------------------------------------------------
  # Security groups.
  # Each group sets a placeholder egress rule inline. That removes the default
  # allow-all egress rule, and the real rules are separate resources so the
  # groups can refer to each other without a dependency cycle.
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hume load balancer. Inbound from the allowed range only.
      VpcId: !GetAtt Neo4jEeLookup.VpcId
      SecurityGroupEgress:
        - Description: Placeholder that removes the default allow-all egress rule
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb'
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hume container instance and the awsvpc tasks that run on it.
      VpcId: !GetAtt Neo4jEeLookup.VpcId
      SecurityGroupEgress:
        - Description: Placeholder that removes the default allow-all egress rule
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-instance'
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hume RDS instance. Inbound PostgreSQL from the instance group only.
      VpcId: !GetAtt Neo4jEeLookup.VpcId
      SecurityGroupIngress:
        - Description: PostgreSQL from Hume tasks
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      SecurityGroupEgress:
        - Description: Placeholder that removes the default allow-all egress rule
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-database'
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hume EFS mount targets. Inbound NFS from the instance group only.
      VpcId: !GetAtt Neo4jEeLookup.VpcId
      SecurityGroupIngress:
        - Description: NFS from the Hume instance and tasks
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      SecurityGroupEgress:
        - Description: Placeholder that removes the default allow-all egress rule
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-efs'
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  # The load balancer listens on 443, and on 80 only to redirect to 443. Both
  # ports take the same allowlist, because the redirect must reach the same
  # people. One rule per allowed address and port. Each rule is tied to its
  # slot, not to its address, so an address never moves between rules and an
  # update never asks for a duplicate. Slot 1 always exists. Slots 2 to 5 exist
  # while their parameter is not empty. 5 slots x 2 ports = 10 rules, under the
  # limit of 60 inbound rules per security group.
  AlbIngressHttps:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: Hume over HTTPS
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr1

  AlbIngressHttps2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseCidr2
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: Hume over HTTPS
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr2

  AlbIngressHttps3:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseCidr3
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: Hume over HTTPS
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr3

  AlbIngressHttps4:
    Type: AWS::EC2::SecurityGroupIngress
