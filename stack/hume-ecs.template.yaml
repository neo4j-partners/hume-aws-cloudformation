    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: Hume over HTTPS
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr4

  AlbIngressHttps5:
    Type: AWS::EC2::SecurityGroupIngress
