  # Three rules connect the Hume tasks to the Neo4j stack.
  # Each is a separate resource, so deleting this stack removes it, and the
  # Neo4j stack's own rules are never edited.
  InstanceEgressNeo4jBolt:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      Description: Bolt to the Neo4j load balancer
      IpProtocol: tcp
      FromPort: 7687
      ToPort: 7687
