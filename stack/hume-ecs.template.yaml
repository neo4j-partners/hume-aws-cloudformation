        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  # The browser calls the API and media through their own host names, so the
  # web task gets those two names. They must be https, because a page served
  # over HTTPS cannot call an http address. Server to server calls
  # use Cloud Map names. Nothing in this template makes a server side call to
  # the public host name.
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-web'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub 'docker.graphaware.com/hume-core/hume-web:${HumeVersion}'
          Essential: true
          VersionConsistency: disabled
          MemoryReservation: 64
          PortMappings:
            - ContainerPort: 8081
          Environment:
            - Name: HUME_API_URL
              Value: !Sub 'https://hume-api.${BaseDomainName}'
            - Name: HUME_MEDIA_API_URL
              Value: !Sub 'https://hume-media.${BaseDomainName}/v1'
            # The browser side of OpenID Connect. The Hume settings table says
            # OIDC_ISSUER_URL and its examples say OIDC_ISSUER_URI, so both are
            # set. Cognito's login page refuses to load in a frame, so the
            # session is restored by a full page redirect.
            - !If
              - UseOidc
              - Name: OIDC_ENABLED
                Value: 'true'
              - !Ref AWS::NoValue
            - !If
              - UseOidc
              - Name: OIDC_ISSUER_URL
                Value: !Ref OidcIssuerUri
              - !Ref AWS::NoValue
            - !If
              - UseOidc
              - Name: OIDC_ISSUER_URI
                Value: !Ref OidcIssuerUri
              - !Ref AWS::NoValue
            - !If
              - UseOidc
              - Name: OIDC_CLIENT_ID
                Value: !Ref OidcClientId
              - !Ref AWS::NoValue
            - !If
              - UseOidc
              - Name: OIDC_SCOPE
                Value: !Ref OidcScope
              - !Ref AWS::NoValue
            - !If
              - UseOidc
              - Name: OIDC_SESSION_RESTORATION_METHOD
                Value: full-page-redirect
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  # ---------------------------------------------------------------------------
  # The one-time import task. Two containers share a task scoped volume. The
  # first writes the import files from the task environment, using the
  # postgres image already baked into the AMI for its shell. The second is
  # hume-config-cli, which reads them. The files carry literal values, so they
  # do not depend on the CLI substituting environment variables. Created only when
  # SpineConfigSecretArn is set, because the Marketplace deploy runs no
  # configuration import.
  # The import hands Hume no credential. It writes two Hume secrets, and both
  # are plain values that the Spine resource needs: spine-neo4j-host holds the
  # cluster address, and spine-neo4j-sa-user holds the Neo4j user name. The
  # password stays in Secrets Manager behind a vault reference. The import does
  # not store ORCHESTRA_MEDIA_DOWNLOAD_KEY. Only the Spine workflow
  # ccr-records-import reads it, and the deploy helper skips that workflow.
  # Media keeps its own copy from MediaDownloadKeySecret.
  # config-cli signs in with the initial admin API key, so API keys are on only
  # when this task exists. The key appears on the update that sets
  # SpineConfigSecretArn, not at first boot. The API creates the initial key
  # when it restarts with initial-key.create set to true.
  # ---------------------------------------------------------------------------
  ConfigCliTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: UseSpineImport
    Properties:
      Family: !Sub '${AWS::StackName}-config-cli'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Volumes:
        - Name: import
      ContainerDefinitions:
        - Name: render
          Image: postgres:17-alpine
          Essential: false
          VersionConsistency: disabled
          MemoryReservation: 16
          EntryPoint:
            - sh
            - -c
          Command:
            - |
              set -eu
              mkdir -p /config/secrets /config/variables /config/upload-configs
              cat > /config/manifest.yml <<EOF
              imports:
                - ./secrets
                - ./variables
                - ./upload-configs
              removeOtherRoles: false
              removeOtherResources: false
              removeOtherPermissionGroups: false
              roles:
                - name: ANALYST
              EOF
              cat > /config/variables/frontend-uri.yml <<EOF
              apiVersion: v1
              kind: ContextVariable
              metadata:
                name: hume-frontend-uri
              spec:
                scope: INSTANCE
                key: hume_frontend_uri
                value: '$FRONTEND_URI'
              EOF
              cat > /config/variables/rest-api-uri.yml <<EOF
              apiVersion: v1
              kind: ContextVariable
              metadata:
                name: hume-rest-api-uri
              spec:
                scope: INSTANCE
                key: hume_rest_api_uri
                value: '$REST_API_URI'
              EOF
              cat > /config/upload-configs/default-upload-config.yml <<EOF
              apiVersion: v1
              kind: UploadConfiguration
              metadata: {}
              spec:
                name: "DEFAULT"
                description: "The default upload configuration"
              EOF
          Environment:
            - Name: FRONTEND_URI
              Value: !Sub 'https://hume.${BaseDomainName}'
            - Name: REST_API_URI
              Value: http://api.hume.local:8080/api/v1
          MountPoints:
            - SourceVolume: import
              ContainerPath: /config
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ConfigCliLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: render
        # Runs after render and adds the Spine knowledge graph
        # to the same import. The deploy helper packs the Spine files into the
        # secret as base64 of a bzip2 tar, because the files are too large for
        # the template. The ECS agent injects the secret, as it does the other
        # secrets, so the container needs no AWS access of its own. The files
        # contain $$NAME markers that Hume resolves from its own secrets, so
        # nothing here may expand them. The two Hume secrets give the Spine
        # resource the cluster host and the user name. The password stays in
        # Secrets Manager. The resource file holds the placeholder
        # vault:aws:NEO4J_APP_SECRET_NAME, and the script replaces it with a
        # reference to the neo4j_app secret. The name is the secret ARN without
        # its prefix and its six-character suffix. The ref line is the one place
        # that sets the form. Hume reads a bare-string secret through the plain
        # form vault:aws:<secret-name>. The manual shows
        # vault:aws:<secret-name>/<key>/<field>, so a name with slashes may be
        # split at them. The EE stack uses the slash-free name
        # neo4j-<stack>-app-password, so the plain form works.
        # The script stops if the placeholder is still there or no reference
        # was written. The manifest is edited in place.
        # The analyst perspective lists two actions that call the Spine HTTP
        # API, which this stack does not create, so the files of those actions
        # are not packed. The sed line removes their two names from the
        # perspective, because a perspective that names a missing action may
        # fail the import.
        - Name: render-spine
          Image: postgres:17-alpine
          Essential: false
          VersionConsistency: disabled
          MemoryReservation: 16
          DependsOn:
            - ContainerName: render
              Condition: SUCCESS
          EntryPoint:
            - sh
            - -c
          Command:
            - |
              set -eu
              mkdir -p /config/spine
              printf '%s' "$SPINE_CONFIG" | base64 -d | tar -xj -C /config/spine
              sed -i '/^    - expand-info-about-ccr-imported-phone-numbers$/d;/^    - get-ccr-records-graph$/d' /config/spine/spine-kg/perspectives/analyst-perspective.yml
              cat > /config/secrets/spine-neo4j-host.yml <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: spine-neo4j-host
              spec:
                access: []
                key: SPINE_NEO4J_HOST
                value: "$SPINE_NEO4J_HOST"
              EOF
              cat > /config/secrets/spine-neo4j-sa-user.yml <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: spine-neo4j-sa-user
              spec:
                access: []
                key: SPINE_NEO4J_SA_USER
                value: "$NEO4J_USERNAME"
              EOF
              name=$(printf '%s' "$NEO4J_APP_SECRET_ARN" | sed 's/^.*:secret://;s/-[A-Za-z0-9]\{6\}$//')
              if [ -z "$name" ]; then
                echo "The neo4j_app secret name is empty" >&2
                exit 1
              fi
              ref="vault:aws:$name"
              sa=/config/spine/resources/spine-neo4j-sa.yml
              sed "s|vault:aws:NEO4J_APP_SECRET_NAME|$ref|" "$sa" > "$sa.new"
              mv "$sa.new" "$sa"
              if grep -q NEO4J_APP_SECRET_NAME "$sa" || ! grep -qF "$ref" "$sa"; then
                echo "spine-neo4j-sa.yml has no vault reference" >&2
                exit 1
              fi
              sed -i 's|^  - ./upload-configs$|&\n  - ./spine|' /config/manifest.yml
              printf '  - name: SPINE_ANALYST\n  - name: SPINE_OFFICER\n' >> /config/manifest.yml
          Environment:
            - Name: SPINE_NEO4J_HOST
              Value: !Sub 'neo4j+s://${Neo4jEeLookup.Neo4jHost}'
            - Name: NEO4J_USERNAME
              Value: !GetAtt Neo4jEeLookup.Neo4jUsername
            - Name: NEO4J_APP_SECRET_ARN
              Value: !GetAtt Neo4jEeLookup.Neo4jAppPasswordSecretArn
          Secrets:
            - Name: SPINE_CONFIG
              ValueFrom: !Ref SpineConfigSecretArn
          MountPoints:
            - SourceVolume: import
              ContainerPath: /config
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ConfigCliLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: render-spine
        - Name: config-cli
          Image: !Sub 'docker.graphaware.com/hume-core/hume-config-cli:${HumeVersion}'
          Essential: true
          VersionConsistency: disabled
          MemoryReservation: 256
          DependsOn:
            - ContainerName: render
              Condition: SUCCESS
            - ContainerName: render-spine
              Condition: SUCCESS
          Environment:
            - Name: hume.url
              Value: http://api.hume.local:8080
            - Name: import.path
              Value: /config
            - Name: hume.config.mode
              Value: import
          Secrets:
            - Name: hume.admin.api.key
              ValueFrom: !Ref ApiKeySecret
          MountPoints:
            - SourceVolume: import
              ContainerPath: /config
              ReadOnly: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ConfigCliLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: config-cli
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  # ---------------------------------------------------------------------------
  # Services, created in dependency order: eventstore, orchestra, api, media,
  # web, so each service starts after the ones it connects to. Each service
  # runs the number of tasks its copy parameter sets, one by default,
  # and Orchestra always runs one. A service is placed only on instances that
  # carry the Hume version attribute, and replaces its tasks by stopping first,
  # because one instance has no room for old and new tasks together. The
  # circuit breaker makes a crash loop fail the stack instead of waiting for
  # the default timeout. Rollback is true for every service, so a failed update
  # returns to the last working task definition.
  #
  # Each service also depends on the security group rules the ECS and SSM
  # agents and the load balancer health checks use. A delete or rollback then
  # removes the services first, while the instance can still reach ECS and the
  # health checks still pass, so the tasks stop instead of hanging.
  # ---------------------------------------------------------------------------
  EventstoreService:
    Type: AWS::ECS::Service
    DependsOn:
      - DbInitRun
      - InstanceEgressHttps
      - VpcEndpointIngressFromHume
      - InstanceEgressSelf
      - InstanceEgressDatabase
      - InstanceIngressFromAlbManagementHealth
      - AlbEgressManagementHealth
      - InstanceIngressFromAlbWebAndApi
      - AlbEgressWebAndApi
    Properties:
      Cluster: !Ref Cluster
      ServiceName: eventstore
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      TaskDefinition: !Ref EventstoreTaskDefinition
      DesiredCount: !Ref EventstoreCopies
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub 'attribute:hume.version == ${HumeVersion}'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !GetAtt Neo4jEeLookup.PrivateSubnet1Id
          SecurityGroups:
            - !Ref InstanceSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt EventstoreDiscoveryService.Arn
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  OrchestraService:
    Type: AWS::ECS::Service
    DependsOn:
      - EventstoreService
      - DataMountTarget1
      - DataMountTarget2
      - InstanceEgressEfs
      - InstanceEgressHttps
      - VpcEndpointIngressFromHume
      - InstanceEgressSelf
      - InstanceEgressDatabase
      - InstanceIngressFromAlbManagementHealth
      - AlbEgressManagementHealth
      - InstanceIngressFromAlbWebAndApi
      - AlbEgressWebAndApi
    Properties:
      Cluster: !Ref Cluster
      ServiceName: orchestra
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      TaskDefinition: !Ref OrchestraTaskDefinition
      # Fixed at one copy on purpose. A second Orchestra needs extra licensing,
      # so no parameter controls this count.
      DesiredCount: 1
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub 'attribute:hume.version == ${HumeVersion}'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !GetAtt Neo4jEeLookup.PrivateSubnet1Id
          SecurityGroups:
            - !Ref InstanceSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt OrchestraDiscoveryService.Arn
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - OrchestraService
      - ApiForwardRule
      - DataMountTarget1
      - DataMountTarget2
      - InstanceEgressEfs
      - InstanceEgressHttps
      - VpcEndpointIngressFromHume
      - InstanceEgressSelf
      - InstanceEgressDatabase
      - InstanceIngressFromAlbManagementHealth
      - AlbEgressManagementHealth
      - InstanceIngressFromAlbWebAndApi
      - AlbEgressWebAndApi
    Properties:
      Cluster: !Ref Cluster
      ServiceName: api
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiCopies
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub 'attribute:hume.version == ${HumeVersion}'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !GetAtt Neo4jEeLookup.PrivateSubnet1Id
          SecurityGroups:
            - !Ref InstanceSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargetGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt ApiDiscoveryService.Arn
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  MediaService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiService
      - MediaForwardRule
      - DataMountTarget1
      - DataMountTarget2
      - InstanceEgressEfs
      - InstanceEgressHttps
      - VpcEndpointIngressFromHume
      - InstanceEgressSelf
      - InstanceEgressDatabase
      - InstanceIngressFromAlbManagementHealth
      - AlbEgressManagementHealth
      - InstanceIngressFromAlbWebAndApi
      - AlbEgressWebAndApi
    Properties:
      Cluster: !Ref Cluster
      ServiceName: media
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      TaskDefinition: !Ref MediaTaskDefinition
      DesiredCount: !Ref MediaCopies
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub 'attribute:hume.version == ${HumeVersion}'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !GetAtt Neo4jEeLookup.PrivateSubnet1Id
          SecurityGroups:
            - !Ref InstanceSecurityGroup
      LoadBalancers:
        - ContainerName: media
          ContainerPort: 8008
          TargetGroupArn: !Ref MediaTargetGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt MediaDiscoveryService.Arn
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  WebService:
    Type: AWS::ECS::Service
    DependsOn:
      - MediaService
      - WebForwardRule
      - InstanceEgressHttps
      - VpcEndpointIngressFromHume
      - InstanceEgressSelf
      - InstanceEgressDatabase
      - InstanceIngressFromAlbManagementHealth
      - AlbEgressManagementHealth
      - InstanceIngressFromAlbWebAndApi
      - AlbEgressWebAndApi
    Properties:
      Cluster: !Ref Cluster
      ServiceName: web
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !Ref WebCopies
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub 'attribute:hume.version == ${HumeVersion}'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !GetAtt Neo4jEeLookup.PrivateSubnet1Id
          SecurityGroups:
            - !Ref InstanceSecurityGroup
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8081
          TargetGroupArn: !Ref WebTargetGroup
      Tags:
        - Key: !FindInMap [Prm, Tag, Key]
          Value: !FindInMap [Prm, Tag, Value]

  # Runs hume-config-cli once the API, Orchestra and media services are steady.
  # CloudFormation waits for an ECS service to reach steady state, so the
  # service resources finishing is the "healthy" signal. The custom resource
  # type and its properties are the one-time task interface. It also
  # waits for InstanceBootComplete directly, although the services already do.
  # Created only when SpineConfigSecretArn is set.
  ConfigCliRun:
    Type: Custom::EcsRunTask
    Condition: UseSpineImport
    DependsOn:
      - InstanceBootComplete
      - ApiService
      - OrchestraService
      - MediaService
    Properties:
      ServiceToken: !GetAtt RunTaskFunction.Arn
      ServiceTimeout: 900
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ConfigCliTaskDefinition
      CapacityProvider: !Ref CapacityProvider
      Subnets:
        - !GetAtt Neo4jEeLookup.PrivateSubnet1Id
      SecurityGroups:
        - !Ref InstanceSecurityGroup

Outputs:
  ClusterName:
    Value: !Ref Cluster

  EeStackName:
    Description: The Neo4j EE stack that Hume joins.
    Value: !Ref EeStackName

  Neo4jHost:
    Description: The Neo4j host that Orchestra connects to over neo4j+s.
    Value: !GetAtt Neo4jEeLookup.Neo4jHost

  VpcId:
    Value: !GetAtt Neo4jEeLookup.VpcId

  InstanceSubnetId:
    Description: Subnet of the container instance and its tasks.
    Value: !GetAtt Neo4jEeLookup.PrivateSubnet1Id

  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup

  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup

  ConfigCliTaskDefinitionArn:
    Condition: UseSpineImport
    Description: The configuration import task.
    Value: !Ref ConfigCliTaskDefinition

  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup

  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn

  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup

  CapacityProviderName:
    Value: !Ref CapacityProvider

  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address

  DatabaseMasterSecretArn:
    Value: !Ref DbMasterSecret

  SmokeTestTaskDefinitionArn:
    Value: !Ref SmokeTestTaskDefinition

  SecretNamePrefix:
    Description: Every secret in this stack has a name that starts with this prefix.
    Value: !Sub 'hume/${AWS::StackName}/'

  LicenceSecretArn:
    Description: Secret that holds the Hume licence key. It lives outside the stack. The Hume service tasks read it.
    Value: !Ref HumeLicenceSecretArn

  LogGroupPrefix:
    Value: !Sub '/hume/${AWS::StackName}/'

  DbInitTaskDefinitionArn:
    Value: !Ref DbInitTaskDefinition

  AlbDnsName:
    Description: Address of the load balancer.
    Value: !GetAtt LoadBalancer.DNSName

  WebUrl:
    Description: Hume web UI.
    Value: !Sub 'https://hume.${BaseDomainName}'

  ApiUrl:
    Description: Hume API.
    Value: !Sub 'https://hume-api.${BaseDomainName}'

  MediaUrl:
    Description: Hume media, as the browser calls it.
    Value: !Sub 'https://hume-media.${BaseDomainName}/v1'

  CertificateArn:
    Description: ACM certificate on the HTTPS listener. It covers the three host names.
    Value: !Ref Certificate

  AdminUsername:
    Condition: UseNativeAuth
    Description: Native administrator user name.
    Value: admin

  AdminPasswordSecretArn:
    Condition: UseNativeAuth
    Description: Secret that holds the administrator password. Read it with the AWS CLI.
    Value: !Ref AdminPasswordSecret

  WebAclName:
    Description: WAF web ACL. Its rate rule and its common rule set both block.
    Value: !Sub '${AWS::StackName}-alb'

  WebAclLogGroupName:
    Description: Log group that holds the WAF log.
    Value: !Ref WebAclLogGroup

  AccessLogBucketName:
    Description: S3 bucket that holds the load balancer access logs, under the prefix alb/.
    Value: !Ref AccessLogBucket

  FileSystemId:
    Description: >-
      EFS file system that holds the Hume data. The stack keeps it when it
      deletes the stack. A stack that restores from this one passes it as
      ExistingFileSystemId.
    Value: !If [CreateFileSystem, !Ref DataFileSystem, !Ref ExistingFileSystemId]

  AlarmTopicArn:
    Description: SNS topic that receives every alarm.
    Value: !Ref AlarmTopic

  DataKeyArn:
    Description: >-
      Customer managed key for the stack secrets, the database, and the file
      system. The stack keeps it when it deletes the stack. A stack that
      restores from this one passes it as ExistingDataKeyArn.
    Value: !If [CreateDataKey, !GetAtt DataKey.Arn, !Ref ExistingDataKeyArn]
